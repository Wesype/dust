name: Sync fork with upstream (dust-tt/dust)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write
  checks: write

jobs:
  sync:
    name: Sync main branch from upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Sync upstream sans les workflows
        run: |
          git remote add upstream https://github.com/dust-tt/dust.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit --allow-unrelated-histories
          git checkout HEAD -- .github/workflows/
          git push origin main

      - name: Log sync result
        run: echo "✅ Fork synced with dust-tt/dust at $(date)"
