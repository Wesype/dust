name: Sync fork with upstream (dust-tt/dust)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write
  checks: write

jobs:
  sync:
    name: Sync main branch from upstream
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork via GitHub CLI
        run: gh repo sync Wesype/dust --source dust-tt/dust --branch main --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log sync result
        run: echo "✅ Fork synced with dust-tt/dust at $(date)"
