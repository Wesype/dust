name: Sync fork with upstream (dust-tt/dust)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: Sync upstream (exclude .github/workflows/)
        run: |
          git remote add upstream https://github.com/dust-tt/dust.git
          git fetch upstream

          if git diff --quiet HEAD upstream/main; then
            echo "✅ Already up to date"
            exit 0
          fi

          git merge --squash upstream/main --allow-unrelated-histories -X theirs

          # Retirer les workflows upstream, restaurer les nôtres
          git rm -rf --cached .github/workflows/ 2>/dev/null || true
          rm -rf .github/workflows/
          git checkout HEAD -- .github/workflows/ 2>/dev/null || true

          # Ne committer que s'il reste des changements réels (pas que des workflows)
          if git diff --cached --quiet; then
            echo "✅ Upstream changes were workflows-only — nothing to push"
            exit 0
          fi

          git commit -m "chore: sync upstream dust-tt/dust $(date -u '+%Y-%m-%d')"
          git push origin main
          echo "✅ Done"
